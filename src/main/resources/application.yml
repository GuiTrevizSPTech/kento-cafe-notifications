spring:
  application:
    name: monitoramento
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/monitoramento_pedidos}
    username: ${DB_USER}
    password: ${DB_PASS}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP   # Instant ↔ DATETIME(6) no validate
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASS}
    listener:
      simple:
        default-requeue-rejected: false    # após os retries, vai para a DLQ
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2

monitoramento:
  prazo:
    base: ${PRAZO_BASE:PT5M}
    por-item: ${PRAZO_POR_ITEM:PT2M}